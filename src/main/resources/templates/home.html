<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mottu - Login e Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pages/home.css}"/>
</head>
<body>
<div class="container">
    <div class="logo">Mottu</div>
    <h1>Bem-vindo! Faça login ou crie sua conta</h1>

    <div class="buttons">
        <a th:href="@{/login}" class="btn">Login</a>
        <a th:href="@{/cadastro}" class="btn">Cadastrar</a>
    </div>

    <p th:if="${successMessage}" class="success-message" th:text="${successMessage}"></p>
    <p th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></p>
</div>

<div th:if="${showLoginModal}" class="modal">
    <div class="modal-content">
        <a th:href="@{/}" class="close">&times;</a>
        <h2>Login</h2>
        <form method="POST" th:action="@{/login}">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</div>

<div th:if="${showCadastroModal}" class="modal">
    <div class="modal-content">
        <a th:href="@{/}" class="close">&times;</a>
        <h2>Cadastrar</h2>
        <form method="POST" th:action="@{/save}">
            <input type="text" name="username" placeholder="Nome" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Senha" required>
            <input type="number" name="roleId" placeholder="Role ID (1=Admin,2=Operador)" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</div>
</body>
</html>
