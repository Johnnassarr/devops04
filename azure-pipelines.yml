# =============================================================================
# Azure DevOps Pipeline - Mottu API
# =============================================================================
# Pipeline de CI - Build, Test e Push para ACR
# NOTA: Deploy stage comentado - requer Azure CLI instalado
# =============================================================================

trigger:
  branches:
    include:
    - main
    - develop
  paths:
    exclude:
    - README.md
    - SETUP-GUIDE.md
    - '*.sh'

pr:
  branches:
    include:
    - main
    - develop

variables:
  # Build variables
  mavenVersion: '3.8.x'
  jdkVersion: '17'
  
  # Azure Service Connection (IMPORTANTE: Configure este valor!)
  azureServiceConnection: '2b4ef3b2-0971-4f1b-89e4-d7bdb1ac7b55'
  
  # Azure variables
  azureRG: 'rg-challenge3-rm556221'
  acrName: 'acrchallenge3rm556221'
  acrLoginServer: 'acrchallenge3rm556221.azurecr.io'
  location: 'eastus'
  
  # Image variables
  imageName: 'mottu-api'
  imageTag: '$(Build.BuildId)'
  
  # Database variables (Configure no Azure DevOps)
  # dbHost: '<IP-do-banco-obtido-no-setup>'
  # dbPort: '5432'
  # dbName: 'mottu-api'
  # dbUser: 'postgres'
  # dbPassword: '<configured-as-secret>'

stages:
# =============================================================================
# STAGE 1: BUILD & PUSH (CI)
# =============================================================================
- stage: Build
  displayName: 'Build and Push to ACR'
  jobs:
  - job: BuildJob
    displayName: 'Build Application'
    pool:
      name: self-hosted-pool
    
    steps:
    # Checkout code
    - checkout: self
      displayName: '📥 Checkout Repository'
      clean: true
    
    # Setup Java
    - task: JavaToolInstaller@0
      displayName: '☕ Setup Java $(jdkVersion)'
      inputs:
        versionSpec: '$(jdkVersion)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    
    # Build with Maven
    - task: Maven@3
      displayName: '🔨 Maven: Clean and Build'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        options: '-DskipTests=false'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '$(jdkVersion)'
        mavenVersionOption: 'Default'
        mavenAuthenticateFeed: false
    
    # Publish build artifact
    - task: PublishBuildArtifacts@1
      displayName: '📦 Publish Artifact'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target'
        ArtifactName: 'target'
        publishLocation: 'Container'
    
    # Docker: Build Image
    - task: Docker@2
      displayName: '🐳 Docker: Build Image'
      inputs:
        command: 'build'
        repository: '$(imageName)'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(imageTag)
          latest
    
    # ACR: Login
    - task: Docker@2
      displayName: '🔐 ACR: Login'
      inputs:
        command: 'login'
        containerRegistry: '$(azureServiceConnection)'
    
    # Docker: Tag for ACR
    - task: PowerShell@2
      displayName: '🏷️ Docker: Tag Images for ACR'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Tagging images for ACR..."
          docker tag $(imageName):$(imageTag) $(acrLoginServer)/$(imageName):$(imageTag)
          docker tag $(imageName):latest $(acrLoginServer)/$(imageName):latest
          Write-Host "✓ Images tagged"
    
    # Push to ACR
    - task: PowerShell@2
      displayName: '⬆️ ACR: Push Images'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Pushing images to ACR..."
          docker push $(acrLoginServer)/$(imageName):$(imageTag)
          docker push $(acrLoginServer)/$(imageName):latest
          Write-Host "✓ Images pushed successfully!"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BUILD SUMMARY"
          Write-Host "=========================================="
          Write-Host "Image: $(acrLoginServer)/$(imageName):$(imageTag)"
          Write-Host "Latest: $(acrLoginServer)/$(imageName):latest"
          Write-Host "Build ID: $(Build.BuildId)"
          Write-Host "=========================================="

# =============================================================================
