# =============================================================================
# Azure DevOps Pipeline - Mottu API
# =============================================================================
# Pipeline de CI - Build, Test e Push para ACR
# NOTA: Deploy stage comentado - requer Azure CLI instalado
# =============================================================================

trigger:
  branches:
    include:
    - main
    - develop
  paths:
    exclude:
    - README.md
    - SETUP-GUIDE.md
    - '*.sh'

pr:
  branches:
    include:
    - main
    - develop

variables:
  # Build variables
  mavenVersion: '3.8.x'
  jdkVersion: '17'
  
  # Azure Service Connection (IMPORTANTE: Configure este valor!)
  azureServiceConnection: '2b4ef3b2-0971-4f1b-89e4-d7bdb1ac7b55'
  
  # Azure variables
  azureRG: 'rg-challenge3-rm556221'
  acrName: 'acrchallenge3rm556221'
  acrLoginServer: 'acrchallenge3rm556221.azurecr.io'
  location: 'eastus'
  
  # Image variables
  imageName: 'mottu-api'
  imageTag: '$(Build.BuildId)'
  
  # ACR Credentials (IMPORTANTE: Configure estas variáveis no Azure DevOps!)
  # acrUsername: '<nome-do-acr>' (geralmente igual ao acrName)
  # acrPassword: '<senha-do-acr>' (configure como SECRET)
  # Para obter: az acr credential show --name acrchallenge3rm556221
  
  # Database variables (Configure no Azure DevOps)
  # dbHost: '<IP-do-banco-obtido-no-setup>'
  # dbPort: '5432'
  # dbName: 'mottu-api'
  # dbUser: 'postgres'
  # dbPassword: '<configured-as-secret>'

stages:
# =============================================================================
# STAGE 1: BUILD & PUSH (CI)
# =============================================================================
- stage: Build
  displayName: 'Build and Push to ACR'
  jobs:
  - job: BuildJob
    displayName: 'Build Application'
    pool:
      name: self-hosted-pool
    # NOTA: Este job precisa de Java 17 e Docker instalados no agente
    # Para instalar Java no Ubuntu: sudo apt install openjdk-17-jdk -y
    
    steps:
    # Checkout code
    - checkout: self
      displayName: '📥 Checkout Repository'
      clean: true
    
    # Instalar Java se não estiver instalado (somente para Ubuntu/Debian)
    - task: Bash@3
      displayName: '☕ Instalar/Verificar Java 17'
      inputs:
        targetType: 'inline'
        script: |
          echo "Verificando Java..."
          
          if command -v java &> /dev/null; then
            echo "Java já está instalado:"
            java -version
          else
            echo "Java não encontrado. Instalando OpenJDK 17..."
            sudo apt update
            sudo apt install -y openjdk-17-jdk
            echo "Java instalado com sucesso:"
            java -version
          fi
          
          # Configurar JAVA_HOME se não estiver definido
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
            echo "JAVA_HOME set to: $JAVA_HOME"
          fi
    
    # Build with Maven Wrapper
    - task: Bash@3
      displayName: '🔨 Maven: Clean and Build'
      inputs:
        targetType: 'inline'
        script: |
          echo "Building with Maven Wrapper..."
          echo "Working directory: $(pwd)"
          
          # Configurar HOME (necessário para mvnw)
          if [ -z "$HOME" ]; then
            export HOME=/root
            echo "HOME set to: $HOME"
          fi
          
          # Configurar JAVA_HOME
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Dar permissão ao Maven Wrapper
          chmod +x mvnw
          
          # Build com Maven Wrapper
          ./mvnw clean package -DskipTests=false
          
          echo ""
          echo "✓ Build completed!"
          echo "Artifact location: target/"
          
          # Verificar se o build gerou o JAR
          if [ -d "target" ]; then
            echo "Directory target/ exists"
            ls -lah target/*.jar 2>/dev/null || echo "No JAR files found"
          else
            echo "ERROR: Directory target/ was not created!"
            exit 1
          fi
    
    # Publish test results
    - task: PublishTestResults@2
      displayName: '📊 Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        mergeTestResults: true
        failTaskOnFailedTests: false
        testRunTitle: 'Unit Tests'
    
    # Publish build artifact
    - task: PublishBuildArtifacts@1
      displayName: '📦 Publish Artifact'
      condition: succeeded()
      continueOnError: true
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/target'
        ArtifactName: 'target'
        publishLocation: 'Container'
    
    # Docker: Build Image
    - task: Docker@2
      displayName: '🐳 Docker: Build Image'
      inputs:
        command: 'build'
        repository: '$(imageName)'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(imageTag)
          latest
    
    # ACR: Login com credenciais
    - task: Bash@3
      displayName: '🔐 ACR: Docker Login'
      inputs:
        targetType: 'inline'
        script: |
          echo "Fazendo login no ACR: $(acrLoginServer)"
          
          # Verificar se a senha está configurada
          if [ -z "$ACR_PASSWORD" ]; then
            echo ""
            echo "❌ ERRO: Variável 'acrPassword' não está configurada!"
            echo ""
            echo "📋 Para configurar:"
            echo "  1. Acesse: Azure DevOps → Pipelines → Seu Pipeline → Edit"
            echo "  2. Clique em ⋯ (três pontinhos) → Variables"
            echo "  3. Adicione: acrPassword (marque como SECRET 🔒)"
            echo "  4. Valor: obtenha com: az acr credential show --name $(acrName)"
            echo ""
            echo "💡 Ou execute: az acr credential show --name $(acrName) --query passwords[0].value -o tsv"
            echo ""
            exit 1
          fi
          
          # Fazer login no ACR
          echo "$ACR_PASSWORD" | docker login $(acrLoginServer) --username $(acrName) --password-stdin
          
          if [ $? -eq 0 ]; then
            echo ""
            echo "✅ Login realizado com sucesso no ACR!"
            echo ""
          else
            echo ""
            echo "❌ ERRO: Falha ao fazer login no ACR!"
            echo ""
            exit 1
          fi
      env:
        ACR_PASSWORD: $(acrPassword)
    
    # Docker: Tag for ACR
    - task: Bash@3
      displayName: '🏷️ Docker: Tag Images for ACR'
      inputs:
        targetType: 'inline'
        script: |
          echo "Tagging images for ACR..."
          docker tag $(imageName):$(imageTag) $(acrLoginServer)/$(imageName):$(imageTag)
          docker tag $(imageName):latest $(acrLoginServer)/$(imageName):latest
          echo "✓ Images tagged"
    
    # Push to ACR
    - task: Bash@3
      displayName: '⬆️ ACR: Push Images'
      inputs:
        targetType: 'inline'
        script: |
          echo "Pushing images to ACR..."
          docker push $(acrLoginServer)/$(imageName):$(imageTag)
          docker push $(acrLoginServer)/$(imageName):latest
          echo "✓ Images pushed successfully!"
          echo ""
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Image: $(acrLoginServer)/$(imageName):$(imageTag)"
          echo "Latest: $(acrLoginServer)/$(imageName):latest"
          echo "Build ID: $(Build.BuildId)"
          echo "=========================================="

