# =============================================================================
# Docker Compose - Mottu API
# =============================================================================
# Este arquivo permite executar a aplicação completa localmente
# para testes antes do deploy no Azure
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # BANCO DE DADOS POSTGRESQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mottu-postgres-local
    environment:
      POSTGRES_DB: mottu-api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mottu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # APLICAÇÃO JAVA SPRING BOOT
  # ---------------------------------------------------------------------------
  mottu-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mottu-api-local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mottu-api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mottu-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  mottu-network:
    driver: bridge
